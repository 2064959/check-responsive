
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-Responsive | Interactive Audit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --sidebar: #121212;
            --border: #2a2a2a;
            --accent: #3b82f6;
            --accent-dim: rgba(59, 130, 246, 0.1);
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --critical: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navbar */
        nav {
            height: 56px;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.5px;
            margin-right: 20px;
            color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 4px;
            height: 100%;
            align-items: flex-end;
        }

        .tab {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: 0;
            border-radius: 6px 6px 0 0;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab:hover { color: var(--text); background: var(--accent-dim); }
        .tab.active { 
            background: var(--bg); 
            border-color: var(--border); 
            color: var(--text);
            font-weight: 500;
        }

        /* Layout */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 320px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .section {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .viewport-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .vp-item {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .vp-item:hover { background: var(--accent-dim); }
        .vp-item.active { 
            background: var(--accent-dim); 
            border-color: var(--accent);
            color: var(--accent);
        }

        .issue-card {
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .issue-card:hover { border-color: var(--accent); }
        .issue-card.selected { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .severity {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .severity.critical { background: var(--critical); color: white; }
        .severity.warning { background: var(--warning); color: black; }

        .issue-msg { font-size: 12px; line-height: 1.4; margin-bottom: 8px; }
        .issue-el { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 10px; 
            color: var(--text-dim);
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 4px;
            display: block;
            word-break: break-all;
        }

        .approve-checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            accent-color: var(--success);
        }

        /* Viewer - pan/zoom canvas */
        .viewer {
            flex: 1;
            background: #111;
            overflow: hidden;
            position: relative;
            cursor: grab;
            user-select: none;
        }
        .viewer.dragging { cursor: grabbing; }

        /* checkerboard background */
        .viewer::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(45deg, #1a1a1a 25%, transparent 25%),
                linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
                linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            pointer-events: none;
            opacity: 0.5;
        }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            background: white;
            box-shadow: 0 8px 60px rgba(0,0,0,0.7);
            will-change: transform;
        }

        iframe {
            display: block;
            border: 0;
            /* width/height set dynamically */
        }

        /* Footer */
        .toolbar {
            height: 48px;
            background: var(--sidebar);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            background: var(--border);
            color: var(--text);
            border: 1px solid #3a3a3a;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .btn-icon:hover { background: var(--accent); border-color: var(--accent); }

        .zoom-label {
            font-size: 12px;
            color: var(--text-dim);
            min-width: 44px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .btn-fit {
            background: var(--border);
            color: var(--text);
            border: 1px solid #3a3a3a;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-fit:hover { background: var(--accent); border-color: var(--accent); }

        button.primary {
            background: var(--accent);
            color: white;
            border: 0;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        button.primary:hover { background: #2563eb; }

        .stat { font-size: 12px; color: var(--text-dim); }
        .stat b { color: var(--text); }

        .hint {
            font-size: 11px;
            color: #555;
            pointer-events: none;
        }
    </style>
</head>

            <button class="btn-fit" onclick="fitToView(true)" title="Fit to screen">Fit</button>
        </div>
        <button class="primary" onclick="exportReport()">Export Final Audit JSON</button>
    </footer>

},{"page":"http://localhost:3000/stress-test.html","viewport":"Large Desktop","type":"VIEWPORT OVERFLOW","severity":"CRITICAL","message":"Element overflowed the right edge of the screen by 21 pixels.","element":"#pos-abs-right-var-f5kmp-var-lefx7k > div.container > div","screenshot":null},{"page":"http://localhost:3000/stress-test.html","viewport":"Large Desktop","type":"CONTAINER OVERFLOW","severity":"WARNING","message":"Content overflowed its container horizontally by 51 pixels.","element":"#pos-abs-right-var-b38jxf-var-7k0ec-var-vwwu3","screenshot":null},{"page":"http://localhost:3000/stress-test.html","viewport":"Large Desktop","type":"CONTAINER OVERFLOW","severity":"WARNING","message":"Content overflowed its container vertically by 14 pixels.","element":"#pos-abs-right-var-b38jxf-var-7k0ec-var-vwwu3 > div.container","screenshot":null},{"page":"http://localhost:3000/stress-test.html","viewport":"Large Desktop","type":"VIEWPORT OVERFLOW","severity":"CRITICAL","message":"Element overflowed the right edge of the screen by 21 pixels.","element":"#pos-abs-right-var-b38jxf-var-7k0ec-var-vwwu3 > div.container > div","screenshot":null},{"page":"http://localhost:3000/stress-test.html","viewport":"Large Desktop","type":"CONTAINER OVERFLOW","severity":"WARNING","message":"Content overflowed its container horizontally by 1520 pixels.","element":"#pseudo-after-width","screenshot":null}],"pages_snapshots":{"http://localhost:3000/stress-test.html":{"Mobile Portrait":"snapshots\\stress-test-html_mobile-portrait.html","Mobile Landscape":"snapshots\\stress-test-html_mobile-landscape.html","Tablet Portrait":"snapshots\\stress-test-html_tablet-portrait.html","Tablet Landscape":"snapshots\\stress-test-html_tablet-landscape.html","Small Desktop":"snapshots\\stress-test-html_small-desktop.html","Large Desktop":"snapshots\\stress-test-html_large-desktop.html"}}};
        let currentPage = data.pages_tested[0];
        let currentVp = 'Mobile Portrait';
        let selectedIssues = new Set();

        // Pan/Zoom state
        let scale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let panStart  = { x: 0, y: 0 };
        let pendingSelector = null;

        const vpDef = {
            'Mobile Portrait':  { w: 375,  h: 667  },
            'Mobile Landscape': { w: 667,  h: 375  },
            'Tablet Portrait':  { w: 768,  h: 1024 },
            'Tablet Landscape': { w: 1024, h: 768  },
            'Small Desktop':    { w: 1280, h: 800  },
            'Large Desktop':    { w: 1440, h: 900  }
        };

        // ── Pan / Zoom engine ──────────────────────────────────────────
        function applyTransform() {
            document.getElementById('iframe-wrap').style.transform =
                `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function updateZoomLabel() {
            document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
        }

        function resetView(animate) {
            const canvas = document.getElementById('viewer-canvas');
            const vpW    = parseFloat(document.getElementById('iframe-wrap').style.width) || vpDef[currentVp].w;
            scale = 1;
            panX  = (canvas.clientWidth - vpW) / 2;
            panY  = 40;
            if (animate) {
                const w = document.getElementById('iframe-wrap');
                w.style.transition = 'transform .25s ease';
                setTimeout(() => w.style.transition = '', 280);
            }
            applyTransform();
            updateZoomLabel();
        }

        function fitToView(animate) {
            const canvas = document.getElementById('viewer-canvas');
            const wrap   = document.getElementById('iframe-wrap');
            const vpW    = parseFloat(wrap.style.width)  || vpDef[currentVp].w;
            const vpH    = parseFloat(wrap.style.height) || 800;
            const cW     = canvas.clientWidth  - 80;
            const cH     = canvas.clientHeight - 80;
            scale  = Math.min(cW / vpW, cH / vpH, 1);
            panX   = (canvas.clientWidth  - vpW * scale) / 2;
            panY   = 40;
            if (animate) {
                const w = document.getElementById('iframe-wrap');
                w.style.transition = 'transform .25s ease';
                setTimeout(() => w.style.transition = '', 280);
            }
            applyTransform();
            updateZoomLabel();
        }


        function zoomAt(cx, cy, newScale) {
            newScale = Math.max(0.08, Math.min(4, newScale));
            panX = cx - (cx - panX) * (newScale / scale);
            panY = cy - (cy - panY) * (newScale / scale);
            scale = newScale;
            applyTransform();
            updateZoomLabel();
        }

        function zoomIn()  { const c = document.getElementById('viewer-canvas'); zoomAt(c.clientWidth/2, c.clientHeight/2, scale * 1.25); }
        function zoomOut() { const c = document.getElementById('viewer-canvas'); zoomAt(c.clientWidth/2, c.clientHeight/2, scale / 1.25); }

        function initZoomPan() {
            const canvas = document.getElementById('viewer-canvas');

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect  = canvas.getBoundingClientRect();
                const delta = e.deltaY < 0 ? 1.12 : 1 / 1.12;
                zoomAt(e.clientX - rect.left, e.clientY - rect.top, scale * delta);
            }, { passive: false });

            canvas.addEventListener('mousedown', (e) => {
                const isPan = e.button === 1 || (e.button === 0 && e.ctrlKey);
                if (!isPan) return;
                e.preventDefault();
                isDragging = true;
                dragStart  = { x: e.clientX, y: e.clientY };
                panStart   = { x: panX, y: panY };
                canvas.classList.add('dragging');
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = panStart.x + (e.clientX - dragStart.x);
                panY = panStart.y + (e.clientY - dragStart.y);
                applyTransform();
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false; document.getElementById('viewer-canvas').classList.remove('dragging'); }
            });

            canvas.addEventListener('contextmenu', e => e.preventDefault());
        }

        // ── iframe full-height loading ─────────────────────────────────
        function setIframeUrl(snapshotPath) {
            const frame  = document.getElementById('target-frame');
            const wrap   = document.getElementById('iframe-wrap');
            const canvas = document.getElementById('viewer-canvas');
            const vpW    = vpDef[currentVp].w;

            // Size the container
            frame.style.width  = vpW + 'px';
            frame.style.height = '800px';
            wrap.style.width   = vpW + 'px';
            wrap.style.height  = '800px';

            // ✅ Position at center/top BEFORE src loads → no jump on render
            scale = 1;
            panX  = (canvas.clientWidth - vpW) / 2;
            panY  = 40;
            applyTransform();
            updateZoomLabel();

            frame.onload = () => {
                try {
                    const h = frame.contentDocument.documentElement.scrollHeight;
                    frame.style.height = h + 'px';
                    wrap.style.height  = h + 'px';
                    // Re-center after height is known (panX unchanged, stay at top)
                    panX = (canvas.clientWidth - vpW) / 2;
                    panY = 40;
                    applyTransform();
                } catch(e) {}
                if (pendingSelector) doHighlight(pendingSelector);
            };

            frame.src = snapshotPath;
        }

        // ── Highlighting ───────────────────────────────────────────────
        function doHighlight(selector) {
            const frame = document.getElementById('target-frame');
            try {
                const doc = frame.contentDocument;
                if (!doc || doc.readyState !== 'complete') return;

                if (!doc.getElementById('check-resp-anim')) {
                    const s = doc.createElement('style');
                    s.id = 'check-resp-anim';
                    s.textContent = `
                        @keyframes crh-pulse {
                            0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.9); }
                            70%  { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
                            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
                        }
                        .crh {
                            outline: 3px solid #ef4444 !important;
                            outline-offset: 3px !important;
                            animation: crh-pulse 1.2s ease-in-out infinite !important;
                        }
                    `;
                    doc.head.appendChild(s);
                }

                doc.querySelectorAll('.crh').forEach(el => el.classList.remove('crh'));
                const el = doc.querySelector(selector);
                if (!el) { console.warn('crh: not found:', selector); return; }
                el.classList.add('crh');

                // ✅ Smooth pan to keep element in view
                const canvas   = document.getElementById('viewer-canvas');
                const wrapEl   = document.getElementById('iframe-wrap');
                const wrapRect = wrapEl.getBoundingClientRect();
                const elRect   = el.getBoundingClientRect();
                const elTop    = wrapRect.top + elRect.top * scale;
                const elBot    = wrapRect.top + elRect.bottom * scale;
                const margin   = 80;
                let needsPan   = false;

                if (elTop < margin) { panY += margin - elTop; needsPan = true; }
                else if (elBot > canvas.clientHeight - margin) { panY -= elBot - (canvas.clientHeight - margin); needsPan = true; }

                if (needsPan) {
                    wrapEl.style.transition = 'transform 0.45s cubic-bezier(0.4, 0, 0.2, 1)';
                    applyTransform();
                    setTimeout(() => wrapEl.style.transition = '', 480);
                }
            } catch(e) { console.error('crh:', e); }
        }

        function highlightElement(selector) {
            pendingSelector = selector;
            const frame = document.getElementById('target-frame');
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                doHighlight(selector);
            }
        }

        // ── Navigation ─────────────────────────────────────────────────
        function init() {
            initZoomPan();
            renderTabs();
            renderViewports();
            update();
        }

        function renderTabs() {
            const c = document.getElementById('page-tabs');
            c.innerHTML = data.pages_tested.map(url => `
                <div class="tab ${url === currentPage ? 'active' : ''}" onclick="setPage('${url}')">
                    ${new URL(url).pathname || '/'}
                </div>
            `).join('');
        }

        function renderViewports() {
            const c = document.getElementById('vp-list');
            const active = Array.from(new Set(
                data.issues.filter(i => i.page === currentPage).map(i => i.viewport)
            ));
            if (active.length > 0 && !active.includes(currentVp)) currentVp = active[0];
            if (active.length === 0) {
                c.innerHTML = '<div class="stat" style="padding:8px">No issues for this page</div>';
                return;
            }
            c.innerHTML = active.map(name => `
                <div class="vp-item ${name === currentVp ? 'active' : ''}" onclick="setVp('${name}')">
                    ${name} (${vpDef[name].w}×${vpDef[name].h})
                </div>
            `).join('');
        }

        function setPage(url)  { currentPage = url; pendingSelector = null; renderTabs(); renderViewports(); update(); }
        function setVp(name)   { currentVp = name; pendingSelector = null; renderViewports(); update(); }

        function update() {
            const snapshotPath = data.pages_snapshots?.[currentPage]?.[currentVp];
            if (snapshotPath) setIframeUrl(snapshotPath);
            else { document.getElementById('target-frame').src = 'about:blank'; fitToView(false); }
            renderIssues();
        }

        // ── Issues ─────────────────────────────────────────────────────
        function renderIssues() {
            const container = document.getElementById('issue-list');
            const issues = data.issues.filter(i => i.page === currentPage && i.viewport === currentVp);
            document.getElementById('count-total').innerText = issues.length;

            if (issues.length === 0) {
                container.innerHTML = '<div class="stat" style="padding:12px;color:#94a3b8">✅ No issues on this viewport</div>';
                document.getElementById('count-selected').innerText = selectedIssues.size;
                return;
            }

            container.innerHTML = issues.map((issue, idx) => {
                const key = `${issue.page}-${issue.viewport}-${issue.element}-${idx}`;
                const sel = issue.element.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                return `<div class="issue-card ${selectedIssues.has(key) ? 'selected' : ''}" onclick="selectIssue('${key}','${sel}')">
                    <input type="checkbox" class="approve-checkbox" ${selectedIssues.has(key) ? 'checked' : ''} onclick="event.stopPropagation();toggleIssue('${key}')">
                    <div class="issue-header"><span class="severity ${issue.severity.toLowerCase()}">${issue.severity}: ${issue.type}</span></div>
                    <div class="issue-msg">${issue.message}</div>
                    <code class="issue-el">${issue.element}</code>
                </div>`;
            }).join('');

            document.getElementById('count-selected').innerText = selectedIssues.size;
        }

        function selectIssue(key, selector) { highlightElement(selector); }
        function toggleIssue(key) { if (selectedIssues.has(key)) selectedIssues.delete(key); else selectedIssues.add(key); renderIssues(); }

        function exportReport() {
            const final = data.issues.filter((iss, idx) => selectedIssues.has(`${iss.page}-${iss.viewport}-${iss.element}-${idx}`));
            const blob = new Blob([JSON.stringify({...data, issues: final}, null, 2)], {type:'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href=url; a.download='final-audit.json'; a.click();
        }

        init();
    </script>
</body>
