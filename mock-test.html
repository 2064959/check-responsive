<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test</title>
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
        }
        /* 1. Off-canvas element (should be ignored) */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: #333;
            transform: translateX(-100%); /* Off-screen */
        }

        /* 2. Sub-pixel overflow (should be ignored by default 2.0px tolerance) */
        .tiny-overflow {
            width: 100%;
            height: 50px;
            background: blue;
        }
        .tiny-overflow::after {
            content: '';
            display: inline-block;
            width: calc(100% + 1.5px); /* 1.5px overflow */
            height: 10px;
            background: red;
        }

        /* 3. Marquee (should be ignored) */
        .marquee {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 10s linear infinite;
        }
        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        /* 4. Opacity 0 (should be ignored) */
        .invisible {
            width: 200%;
            height: 20px;
            background: green;
            opacity: 0;
        }

        /* 5. Real overflow (should be caught) */
        .real-overflow {
            width: calc(100% + 10px); /* 10px overflow */
            height: 50px;
            background: orange;
        }
    </style>
</head>
<body>
    <div class="sidebar">Sidebar</div>
    <div class="tiny-overflow">Tiny</div>
    <div class="marquee"><div class="marquee-content">This is a marquee ticker that overflows intentionally</div></div>
    <div class="invisible">Invisible</div>
    <div class="real-overflow">Real Overflow (10px)</div>
</body>
</html>
